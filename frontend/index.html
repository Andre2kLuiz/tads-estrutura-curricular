<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Estrutura Curricular · TADS</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --ink: #161a24;
            --muted: #6b7280;
            --line: #e4e6ee;
            --accent: #4f46e5;
            --accent-soft: #eef0ff;
            --pre: #059669;
            --pre-soft: #ecfdf5;
            --dep: #d97706;
            --dep-soft: #fff7e6;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0f15;
                --card: #161a24;
                --ink: #e7e9f0;
                --muted: #8e95a8;
                --line: #262b3a;
                --accent: #818cf8;
                --accent-soft: #1d2140;
                --pre: #34d399;
                --pre-soft: #0f2a22;
                --dep: #fbbf24;
                --dep-soft: #2a2210;
                --shadow: none;
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.4
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: .85rem 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            align-items: center
        }

        h1 {
            font-size: 1.05rem;
            margin: 0 auto 0 0;
            font-weight: 700;
            letter-spacing: -.01em
        }

        select,
        input,
        button {
            font: inherit;
            font-size: .92rem;
            padding: .5rem .75rem;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink)
        }

        select:focus,
        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px
        }

        button {
            cursor: pointer;
            transition: transform .1s, background .15s
        }

        button:active {
            transform: scale(.97)
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600
        }

        button.ghost:hover {
            background: var(--accent-soft)
        }

        .layout {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 1rem;
            padding: 1rem 1.25rem;
            max-width: 1400px;
            margin: 0 auto
        }

        @media (max-width:900px) {
            .layout {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow)
        }

        /* Lista lateral */
        .sidebar {
            padding: .75rem;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 76px
        }

        @media (max-width:900px) {
            .sidebar {
                position: static;
                max-height: 360px
            }
        }

        .sidebar input {
            width: 100%;
            margin-bottom: .6rem
        }

        .list {
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: .3rem;
            padding-right: .2rem
        }

        .item {
            text-align: left;
            border: 1px solid transparent;
            background: transparent;
            padding: .55rem .65rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: .1rem
        }

        .item:hover {
            background: var(--accent-soft)
        }

        .item.active {
            background: var(--accent-soft);
            border-color: var(--accent)
        }

        .item .code {
            font-size: .75rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: .03em
        }

        .item .nome {
            font-size: .88rem;
            color: var(--ink)
        }

        .count {
            font-size: .78rem;
            color: var(--muted);
            margin: 0 0 .4rem .2rem
        }

        /* Grafo */
        .stage {
            position: relative;
            padding: 1rem;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            gap: 1rem
        }

        .toolbar {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            align-items: center
        }

        .toolbar .sp {
            flex: 1
        }

        .graph {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.05fr 1fr;
            gap: 2.5rem;
            align-items: start;
            flex: 1
        }

        @media (max-width:900px) {
            .graph {
                grid-template-columns: 1fr;
                gap: 1rem
            }
        }

        .graph svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: visible
        }

        @media (max-width:900px) {
            .graph svg {
                display: none
            }
        }

        .col {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: .45rem;
            min-width: 0
        }

        .col-title {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: .2rem
        }

        .col-title.pre {
            color: var(--pre)
        }

        .col-title.dep {
            color: var(--dep)
        }

        .node {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: .55rem .7rem;
            text-align: left;
            width: 100%
        }

        .node.pre:hover {
            border-color: var(--pre)
        }

        .node.dep:hover {
            border-color: var(--dep)
        }

        .node .code {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .03em
        }

        .node.pre .code {
            color: var(--pre)
        }

        .node.dep .code {
            color: var(--dep)
        }

        .node .nome {
            font-size: .87rem
        }

        .node .tipo {
            font-size: .72rem;
            color: var(--muted)
        }

        .group {
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: .45rem;
            display: flex;
            flex-direction: column;
            gap: .35rem;
            background: var(--pre-soft)
        }

        .group-label {
            font-size: .7rem;
            font-weight: 700;
            color: var(--pre);
            padding-left: .2rem
        }

        .or {
            font-size: .7rem;
            font-weight: 700;
            color: var(--muted);
            text-align: center
        }

        .e {
            font-size: .7rem;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
            margin: .2rem 0
        }

        .focus {
            background: var(--accent-soft);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 2
        }

        .focus .code {
            font-size: .8rem;
            font-weight: 700;
            color: var(--accent)
        }

        .focus h2 {
            font-size: 1.1rem;
            margin: .2rem 0 .6rem;
            line-height: 1.3
        }

        .stats {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: .6rem
        }

        .pill {
            font-size: .75rem;
            padding: .2rem .55rem;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line)
        }

        .chain {
            margin-top: .6rem;
            font-size: .8rem;
            color: var(--muted)
        }

        .chain b {
            color: var(--ink)
        }

        .empty {
            color: var(--muted);
            font-size: .9rem;
            padding: .5rem
        }

        .status {
            color: var(--muted);
            font-size: .85rem
        }

        .legend {
            display: flex;
            gap: 1rem;
            font-size: .8rem;
            color: var(--muted);
            flex-wrap: wrap
        }

        .legend span::before {
            content: "";
            display: inline-block;
            width: 18px;
            height: 3px;
            border-radius: 2px;
            margin-right: .35rem;
            vertical-align: middle
        }

        .legend .l-pre::before {
            background: var(--pre)
        }

        .legend .l-dep::before {
            background: var(--dep)
        }

        #compare {
            display: none;
            overflow: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: .9rem
        }

        th,
        td {
            text-align: left;
            padding: .55rem .6rem;
            border-bottom: 1px solid var(--line)
        }

        th {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted)
        }

        .cmp-note {
            font-size: .8rem;
            color: var(--muted);
            margin: .6rem 0 0
        }
    </style>
</head>

<body>

    <header>
        <h1>Estrutura Curricular · TADS</h1>
        <select id="curso" aria-label="Curso"></select>
        <select id="db" aria-label="Banco de dados">
            <option value="postgres">PostgreSQL</option>
            <option value="mongo">MongoDB</option>
            <option value="neo4j">Neo4j</option>
        </select>
        <button class="ghost" onclick="compare()">Comparar os 3 bancos</button>
    </header>

    <div class="layout">
        <aside class="card sidebar">
            <input id="filtro" placeholder="Filtrar por nome ou código…" autocomplete="off">
            <div class="count" id="contagem"></div>
            <div class="list" id="lista">
                <div class="empty">Carregando disciplinas…</div>
            </div>
        </aside>

        <main class="card stage">
            <div class="toolbar">
                <div class="legend">
                    <span class="l-pre">Pré-requisitos</span>
                    <span class="l-dep">Libera</span>
                </div>
                <div class="sp"></div>
                <span class="status" id="status"></span>
            </div>

            <div id="compare" class="card" style="padding:1rem"></div>

            <div class="graph" id="graph">
                <svg id="lines" aria-hidden="true"></svg>
                <section class="col" id="colPre">
                    <div class="col-title pre">Pré-requisitos</div>
                    <div class="empty">Selecione uma disciplina.</div>
                </section>
                <section class="col" id="colFoco">
                    <div class="col-title">Disciplina</div>
                    <div class="empty">Escolha uma disciplina na lista ao lado.</div>
                </section>
                <section class="col" id="colDep">
                    <div class="col-title dep">Libera</div>
                    <div class="empty">—</div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const N = { postgres: "PostgreSQL", mongo: "MongoDB", neo4j: "Neo4j" };
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        const state = { todas: [], porCodigo: {}, sel: null };

        /* ---------- API ---------- */
        async function api(tipo, q = "") {
            const url = `/api/query?db=${$("db").value}&tipo=${tipo}&curso=${$("curso").value}&q=${encodeURIComponent(q)}`;
            const t = performance.now();
            const r = await fetch(url);
            if (!r.ok) throw new Error(await r.text());
            const j = await r.json();
            j.total_ms = (performance.now() - t).toFixed(1);
            return j;
        }

        /* Extrai os códigos de pré-requisitos em grupos (E entre grupos, OU dentro do grupo) */
        function parsePrereq(rs) {
            if (!rs || !rs.length) return [];
            const arr = Object.values(rs[0]).find(Array.isArray) || [];
            const norm = x => (x && typeof x === "object") ? x.codigo : x;
            if (arr.length && Array.isArray(arr[0])) return arr.map(g => g.map(norm));
            if (arr.length) return [arr.map(norm)];
            // Caso retorne uma linha por pré-requisito
            return [rs.map(r => norm(r.codigo ?? r.pre_requisito ?? r.prerequisito)).filter(Boolean)];
        }

        function parseDependentes(rs) {
            return (rs || []).map(d => ({
                codigo: d.codigo, nome: d.nome, tipo: d.tipo_relacao || ""
            }));
        }

        /* ---------- Lista lateral ---------- */
        async function carregarLista() {
            $("lista").innerHTML = '<div class="empty">Carregando disciplinas…</div>';
            try {
                const j = await api("busca", "");
                state.todas = (j.resultado || []).map(r => ({ codigo: r.codigo, nome: r.nome }));
                state.porCodigo = Object.fromEntries(state.todas.map(d => [d.codigo, d]));
                renderLista();
                setStatus(`${N[j.db] || N[$("db").value]}: ${j.total} disciplinas · ${j.tempo_ms} ms`);
            } catch (e) {
                $("lista").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            }
        }

        function renderLista() {
            const f = $("filtro").value.trim().toLowerCase();
            const lista = state.todas.filter(d => !f || d.codigo.toLowerCase().includes(f) || d.nome.toLowerCase().includes(f));
            $("contagem").textContent = `${lista.length} de ${state.todas.length}`;
            $("lista").innerHTML = lista.map(d => `
    <button class="item ${state.sel === d.codigo ? "active" : ""}" data-cod="${esc(d.codigo)}">
      <span class="code">${esc(d.codigo)}</span>
      <span class="nome">${esc(d.nome)}</span>
    </button>`).join("") || '<div class="empty">Nenhuma disciplina encontrada.</div>';
        }

        /* ---------- Seleção e grafo ---------- */
        async function selecionar(codigo) {
            state.sel = codigo;
            renderLista();
            const d = state.porCodigo[codigo] || { codigo, nome: "" };
            $("colFoco").innerHTML = `<div class="col-title">Disciplina</div><div class="empty">Carregando…</div>`;
            $("colPre").innerHTML = `<div class="col-title pre">Pré-requisitos</div>`;
            $("colDep").innerHTML = `<div class="col-title dep">Libera</div>`;

            try {
                const [pre, dep, cadeia] = await Promise.all([
                    api("prereq", codigo),
                    api("dependentes", codigo),
                    api("prereq_transitivo", codigo).catch(() => null)
                ]);
                const grupos = parsePrereq(pre.resultado);
                const libera = parseDependentes(dep.resultado);
                const total = cadeia ? (cadeia.total ?? (cadeia.resultado || []).length) : null;

                renderPre(grupos);
                renderFoco(d, grupos.flat().length, libera.length, total, cadeia);
                renderDep(libera);
                setStatus(`consulta ${pre.tempo_ms} ms · ida e volta ${pre.total_ms} ms`);
            } catch (e) {
                $("colFoco").innerHTML = `<div class="col-title">Disciplina</div><div class="empty">${esc(e.message)}</div>`;
            }
            requestAnimationFrame(desenharLinhas);
        }

        function nodeHtml(cod, side, sub = "") {
            const d = state.porCodigo[cod] || {};
            return `<button class="node ${side}" data-side="${side}" data-cod="${esc(cod)}">
    <div class="code">${esc(cod)}</div>
    <div class="nome">${esc(d.nome || "")}</div>
    ${sub ? `<div class="tipo">${esc(sub)}</div>` : ""}
  </button>`;
        }

        function renderPre(grupos) {
            let html = `<div class="col-title pre">Pré-requisitos</div>`;
            if (!grupos.length) {
                html += `<div class="empty">Nenhum pré-requisito.</div>`;
            } else {
                html += grupos.map((g, i) => {
                    const itens = g.map(c => nodeHtml(c, "pre")).join(`<div class="or">OU</div>`);
                    return `${i ? '<div class="e">E</div>' : ""}
        <div class="group"><div class="group-label">Grupo ${i + 1}</div>${itens}</div>`;
                }).join("");
            }
            $("colPre").innerHTML = html;
        }

        function renderFoco(d, nPre, nDep, nCadeia, cadeia) {
            const chain = cadeia?.resultado?.length
                ? `<div class="chain"><b>Cadeia completa:</b> ${cadeia.resultado.map(c => esc(typeof c === "object" ? c.codigo : c)).join(" → ")}</div>`
                : "";
            $("colFoco").innerHTML = `
    <div class="col-title">Disciplina</div>
    <div class="focus">
      <div class="code">${esc(d.codigo)}</div>
      <h2>${esc(d.nome)}</h2>
      <div class="stats">
        <span class="pill">${nPre} pré-requisito(s)</span>
        <span class="pill">libera ${nDep}</span>
        ${nCadeia != null ? `<span class="pill">cadeia: ${nCadeia}</span>` : ""}
      </div>
      ${chain}
    </div>`;
        }

        function renderDep(libera) {
            let html = `<div class="col-title dep">Libera</div>`;
            html += libera.length
                ? libera.map(d => `<button class="node dep" data-side="dep" data-cod="${esc(d.codigo)}">
        <div class="code">${esc(d.codigo)}</div>
        <div class="nome">${esc(d.nome)}</div>
        ${d.tipo ? `<div class="tipo">${esc(d.tipo)}</div>` : ""}
      </button>`).join("")
                : `<div class="empty">Não libera nenhuma disciplina.</div>`;
            $("colDep").innerHTML = html;
        }

        /* ---------- Linhas (SVG) ligando os painéis ---------- */
        function desenharLinhas() {
            const g = $("graph"), svg = $("lines");
            const W = g.clientWidth, H = g.clientHeight;
            svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
            svg.innerHTML = "";
            const foco = g.querySelector(".focus");
            if (!foco) return;
            const gr = g.getBoundingClientRect(), fr = foco.getBoundingClientRect();
            const fLeft = fr.left - gr.left, fRight = fr.right - gr.left, fY = fr.top - gr.top + fr.height / 2;

            g.querySelectorAll(".node[data-side]").forEach(n => {
                const r = n.getBoundingClientRect();
                const y = r.top - gr.top + r.height / 2;
                const isPre = n.dataset.side === "pre";
                const x1 = isPre ? r.right - gr.left : fRight;
                const x2 = isPre ? fLeft : r.left - gr.left;
                const y1 = isPre ? y : fY;
                const y2 = isPre ? fY : y;
                const dx = Math.abs(x2 - x1) * 0.5;
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("d", `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
                p.setAttribute("fill", "none");
                p.setAttribute("stroke", isPre ? "var(--pre)" : "var(--dep)");
                p.setAttribute("stroke-width", "2");
                p.setAttribute("stroke-linecap", "round");
                p.setAttribute("opacity", ".75");
                if (isPre) p.setAttribute("stroke-dasharray", "0");
                svg.appendChild(p);
            });
        }

        /* ---------- Comparação dos 3 bancos ---------- */
        async function compare() {
            const box = $("compare");
            box.style.display = "block";
            box.innerHTML = '<p class="status">Aquecendo conexões e comparando os bancos…</p>';
            try {
                const codigo = state.sel || "";
                let h = `<table><tr><th>Banco</th><th>Resultados</th><th>Consulta (ms)</th><th>Total (ms)</th></tr>`;
                const saved = $("db").value;
                for (const db of Object.keys(N)) {
                    $("db").value = db;
                    await api("busca", codigo);            // aquece a conexão
                    const j = await api("busca", codigo);  // medição real
                    h += `<tr><td>${N[db]}</td><td>${j.total}</td><td>${j.tempo_ms}</td><td>${j.total_ms}</td></tr>`;
                }
                $("db").value = saved;
                box.innerHTML = h + `</table><p class="cmp-note">Cada banco foi consultado duas vezes; exibida a segunda medição (aquecida).</p>`;
            } catch (e) {
                box.innerHTML = `<p class="status">${esc(e.message)}</p>`;
            }
        }

        /* ---------- Utilidades ---------- */
        function setStatus(t) { $("status").textContent = t; }

        /* ---------- Eventos ---------- */
        document.addEventListener("click", e => {
            const b = e.target.closest("[data-cod]");
            if (b) selecionar(b.dataset.cod);
        });
        $("filtro").addEventListener("input", renderLista);
        $("db").addEventListener("change", () => { carregarLista(); if (state.sel) selecionar(state.sel); });
        $("curso").addEventListener("change", () => { state.sel = null; carregarLista(); });
        window.addEventListener("resize", desenharLinhas);

        /* ---------- Início ---------- */
        fetch("/api/cursos").then(r => r.json()).then(cs => {
            cs.forEach(c => $("curso").add(new Option(c.nome, c.chave)));
            carregarLista();
        });
    </script>
</body>

</html>
